[package]
name = "luks"
description = "Unlocks LUKS1 and LUKS2 volumes with a passphrase, and reads and writes through their encryption"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
fscore = { path = "../fscore" }
aes = { version = "0.8", features = ["zeroize"] }
argon2 = { version = "0.6", default-features = false, features = ["alloc", "parallel", "zeroize"] }
rayon = "1"
base64 = "0.22"
hmac = "0.12"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
zeroize = "1"

[dev-dependencies]
btrfs = { path = "../btrfs" }
ext4 = { path = "../ext4" }
flate2 = "1"
fscore = { path = "../fscore", features = ["testkit"] }
